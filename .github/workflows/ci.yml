# CI: formatting, vet and the full test suite on every push/PR.
# Uses the Go version pinned in go.mod so local and CI never diverge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt (unformatted code fails the build)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed in:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # -race on linux CI catches the data races we intentionally exercise
      # (async promote, concurrent migrations).
      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...